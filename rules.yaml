# Règles des feux tricolores — v1.0, adoptées le 2026-11-09 selon le protocole pré-enregistré
# research/v1_protocol.md (commit e92b515) ; résultats publiés tels quels dans research/v1_results.md.
# Toute modification : commit séparé, justifiée dans CHANGELOG.md, testée selon un protocole écrit AVANT le calcul.
# Règles v0.6 archivées dans archive/rules_v0.6.yaml.
version: "1.0"
frozen_at: "2026-11-09"

windows:
  # Percentiles glissants (indices) : fenêtre de 25 ans, valeur produite dès 15 ans d'historique.
  pct_years: 25
  pct_min_years: 15
  # Séries « rapides » à historique court (VIX, HY OAS, Nasdaq-100 splicé) : minimum 10 ans.
  pct_min_years_fast: 10
  # Dette sur marge (depuis 1997) : fenêtre croissante, minimum 5 ans.
  margin_expanding_min_years: 5
  # Bitcoin : z-score glissant 4 ans (un cycle), minimum 3 ans.
  btc_z_years: 4
  btc_z_min_years: 3

lags:
  # Point-in-time : date de disponibilité = date de référence + décalage.
  shiller_earnings_months: 3        # bénéfices trimestriels connus ~3 mois après
  cape_month_available_days: 0      # le CAPE du mois m est connu en fin de mois m
  aiae_days_after_quarter_end: 70   # Z.1 publié ~10 semaines après le trimestre
  margin_debt_days_after_month_end: 25  # FINRA publie ~3 semaines après le mois

indices:
  assets:
    sp500:  {ticker: "^GSPC", name: "S&P 500", splice: null}
    ndx:    {ticker: "^NDX",  name: "Nasdaq-100", splice: "^IXIC"}   # Composite avant 10/1985
    world:  {ticker: "^990100-USD-STRD", name: "MSCI World (USD)", splice: null}
  valuation:            # V — valorisation EN NIVEAU, commune aux trois indices (S&P 500 ; proxy affiché pour Nasdaq-100 et World)
    method: cape_pit_pct_since_1881   # percentile du CAPE point-in-time parmi toutes les valeurs mensuelles depuis 1881
    min_months: 360
    green_max: 40       # V ≤ 40 → vert
    cher_min: 80        # V ≥ 80 → étiquette « cher » : INFORMATION, pas de règle de report (protocole v1.0 §8.4)
  fear:                 # P — confirmation du vert de capitulation
    indicators: [vix_pct, credit_spread_pct]   # spread = Baa Moody's − Treasury 10 ans (BAA10Y)
    green_min: 80
    drawdown_min: 0.25
  falling_knife:
    sma_months: 10
    mom_months: 3
  leverage_flag:
    sma_months: 10      # clôture mensuelle < moyenne 10 mois → « tendance cassée », appliqué le jour de bourse suivant
  context:              # affiché, HORS règles depuis la v1.0
    extension:          # tension des cours
      indicators: [gap_ma200_pct, mom_12m_pct]
      tense_min: 90
      gsy: {runup_months: 24, runup_min: 1.00, accel_short_months: 6}   # Greenwood-Shleifer-You (établi sur des industries)
    euphoria:           # achats à crédit (dette sur marge FINRA)
      indicators: [margin_debt_yoy_pct]
      high_min: 80
      margin_debt_yoy_extreme: 0.50
    cher_tendu:         # drapeau R1 (V ≥ 80 et écart MM200 ≥ 90e percentile, fenêtre croissante ≥ 15 ans) : passe sur le
      v_min: 80         # Nasdaq-100 (+8,5 pts), échoue sur S&P 500 et World ; NON retenu comme règle (choisi après coup),
      x_min: 90         # affiché comme information et suivi en avant (pré-inscription)
      x_min_years: 15

bitcoin:                # règle B1 (protocole v1.0 §9), en niveaux
  green: {mvrv_max: 1.0, ratio_200w_max: 1.0}   # vert si MVRV < 1 OU prix < moyenne des 200 semaines
  red: {mvrv_min: 3.0}                          # rouge si MVRV ≥ 3 (les détenteurs ont en moyenne triplé leur mise)
  leverage_flag: {sma_days: 200}                # gouverne les « proxys » à levier (type Strategy)
  context:              # affiché, HORS règles depuis la v1.0
    z: {years: 4, min_years: 3}                 # z-scores 4 ans de log(prix/MM200s) et log(MVRV) (règle v0.x)
    gsy: {runup_months: 24, runup_min: 1.00, accel_short_months: 6}
    funding_30d_pct_high: 90                    # taux de financement Deribit
    fng_30d_low: 25
    drawdown_deep: 0.50

# Confirmation (couche d'affichage et d'alerte, pas la règle) : une nouvelle couleur n'est affichée
# qu'après N jours de bourse consécutifs. Ajouté le 2026-11-08 (v0.2) : divise par ~3 les changements
# par an sans modifier les rendements par couleur (docs/robustness.html).
confirmation_days: 5

# Préséance (indices) : 1) vert de capitulation (baisse + peur), 2) vert de valorisation, 3) orange.
# Bitcoin : vert, puis rouge, puis orange (vert et rouge sont incompatibles par construction).
precedence: [green_capitulation, green_valuation, orange]

acceptance:   # critères de validation, évalués par backtest.py, non négociables
  red_time_share_max_indices: 0.25
  red_time_share_max_btc: 0.30
  fwd3y_median_gap_min_annual: 0.05    # vert − rouge, rendement annualisé médian à 3 ans
  drawdown24m_red_deeper_in: "2 of 3 episodes"
  plan_type: {monthly_eur: 1000, exceptional_yearly_eur: 10000}

conduct:
  green:
    regular_contribution: "maintenu"
    reserve: "déploiement par tiers sur 3 mois (6 mois si couteau qui tombe) ; la réserve au-delà de la cible peut aussi être engagée"
    leverage_cap_share_equities: 0.15
    leverage_requires_trend_ok: true
    rebalance_band_pts: 10
  orange:               # y compris « cher » (protocole v1.0 §8.4)
    regular_contribution: "maintenu"
    reserve: "montants exceptionnels déployés en trois tranches mensuelles ; aucune attente d'un meilleur moment (attendre a coûté cher depuis 1990)"
    leverage_cap_share_equities: 0.10
    rebalance_band_pts: 5
  red:                  # Bitcoin seulement depuis la v1.0
    regular_contribution: "maintenu"
    reserve: "aucun achat exceptionnel ; aucune société « proxy » à levier"
    leverage_cap_share_equities: 0.05
    rebalance_band_pts: 5
  trend_broken:
    leverage_cap_share_equities: 0.05
    action_within_trading_days: 5
  exceptional_order_checklist_hours: 48
  bitcoin:              # conduite propre au Bitcoin (règle B1)
    green: "achat exceptionnel possible, par tiers sur trois mois ; pas de société « proxy » à levier si le prix est sous sa moyenne 200 jours"
    orange: "versements habituels seulement ; pas d'achat exceptionnel"
    red: "aucun achat exceptionnel ; aucune société « proxy » à levier ; versements habituels maintenus"
  sell_cooling_days_in_stress: 7    # vente ou arbitrage en période de stress (feu vert, couteau qui tombe, baisse ≥ 20 % depuis le plus haut) : délai 7 jours au lieu de 48 h (repris de Kairys Alpha)
  concentration_max_single_stock: 0.12   # alerte si une action dépasse 12 % du portefeuille risqué (repris de Kairys Alpha)

stocks:   # module actions — Top 100 mondial + stocks.yaml. INDICATIF, NON BACKTESTÉ (protocole v1.0 §10)
  valuation:
    indicators: [ev_ebit_pct, p_fcf_pct]     # lentille 1 : percentiles sur 10 ans de l'historique propre de la société
    pct_years: 10
    pct_min_years: 5
    red_min: 80          # rouge (v1.0) : lentille 1 ≥ 80 ET lentille 2 ≥ 80 ET tendu (écart MM200 ≥ p90 ou GSY)
    green_max: 30        # vert (v1.0) : lentille 1 ≤ 30 ET lentille 2 ≤ 30 ET solide
  cross_section_min_members: 5   # lentille 2 : rang du multiple parmi les sociétés du même mode (EV/EBIT ; P/E pour banques et assureurs)
  stale_accounts_months: 15      # comptes plus anciens : couleur forcée à orange, jauge grisée
  fcf_net_of_sbc: true           # FCF = flux d'exploitation − investissements − rémunération en actions (v1.0)
  extension:
    red_min: 90                                 # écart à la MM200 jours, percentile 10 ans
    gsy: {runup_months: 24, runup_min: 1.00, accel_short_months: 6}
  reverse_dcf:
    wacc: 0.09
    terminal_growth: 0.025
    years: 10
    red_if_implied_over_realized: 1.5           # croissance implicite > 1,5 × croissance réalisée 5 ans → drapeau
  quality:   # « solidité », éliminatoire : une valeur qui échoue ne peut jamais être verte (v0.5 : moyennes pluriannuelles)
    roic_min: 0.10               # rentabilité du capital investi (moyenne 5 ans) ; banques : rentabilité des fonds propres
    fcf_to_net_income_min: 0.70  # part du résultat net transformée en cash libre (moyenne 5 ans)
    net_debt_to_ebitda_max: 2.5  # dette nette du jour / EBITDA moyen 3 ans (2,0 → 2,5 en v0.5, seuil Fundsmith / Kairys Alpha)
    avg_years: 5                 # fenêtre des moyennes (au moins avg_min_years de données)
    avg_min_years: 3
    ebitda_avg_years: 3
    tax_rate: 0.21
    # hors grille : foncières (REIT) — jamais vertes, valorisation P/E et P/B seulement
  leverage_flag: {sma_days: 200}

themes:   # secteurs et thèmes : drapeaux de prix des ETF (bulle GSY, tension, tendance) ; pas de couleur depuis la v1.0
  assets:
    it:        {ticker: "XLK", name: "Technologie de l'information", kind: sector, gics: "Information Technology"}
    financials: {ticker: "XLF", name: "Finance", kind: sector, gics: "Financials"}
    health:    {ticker: "XLV", name: "Santé", kind: sector, gics: "Health Care"}
    discretionary: {ticker: "XLY", name: "Consommation discrétionnaire", kind: sector, gics: "Consumer Discretionary"}
    staples:   {ticker: "XLP", name: "Consommation de base", kind: sector, gics: "Consumer Staples"}
    industrials: {ticker: "XLI", name: "Industrie", kind: sector, gics: "Industrials"}
    energy:    {ticker: "XLE", name: "Énergie", kind: sector, gics: "Energy"}
    materials: {ticker: "XLB", name: "Matériaux", kind: sector, gics: "Materials"}
    utilities: {ticker: "XLU", name: "Services aux collectivités", kind: sector, gics: "Utilities"}
    communication: {ticker: "VOX", name: "Communication", kind: sector, gics: "Communication Services"}
    realestate: {ticker: "VNQ", name: "Immobilier coté", kind: sector, gics: "Real Estate"}
    # thèmes : là où les bulles se sont historiquement formées (industries, périmètre de l'étude GSY), ETF/indice ≥ 15 ans d'historique
    semis:     {ticker: "^SOX", name: "Semi-conducteurs", kind: theme, since: 1993}
    software:  {ticker: "IGV",  name: "Éditeurs de logiciels", kind: theme, since: 2001}
    biotech:   {ticker: "IBB",  name: "Biotechnologies", kind: theme, since: 2001}
    cleanenergy: {ticker: "PBW", name: "Énergies propres", kind: theme, since: 2005}
    goldminers: {ticker: "GDX", name: "Mines d'or", kind: theme, since: 2006}
    homebuilders: {ticker: "XHB", name: "Constructeurs de maisons (États-Unis)", kind: theme, since: 2006}
    defense:   {ticker: "ITA",  name: "Défense et aéronautique", kind: theme, since: 2006}
  sector_min_members: 3        # valorisation médiane affichée seulement avec au moins 3 sociétés du Top 100 (contexte, pas de couleur depuis la v1.0)
  gsy: {runup_months: 24, runup_min: 1.00, accel_short_months: 6}   # Greenwood-Shleifer-You, mesuré sur des SECTEURS
  extension_red_min: 90        # écart à la MM200 j en percentile 25 ans (min 10 ans) → « tendu »
  runup_alert_min: 1.50        # hausse ≥ 150 % sur 2 ans : probabilité de krach ≈ 80 % dans GSY
  leverage_flag: {sma_months: 10}
