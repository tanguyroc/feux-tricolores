name: Feux quotidiens

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 22:00 UTC, du lundi au vendredi (après la clôture US)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feux-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Données
        run: python -m feux update --strict
      - name: Signaux
        run: python -m feux signals
      - name: Univers Top 100 et actions (comptes SEC si SEC_USER_AGENT est défini, sinon prix seuls)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m feux universe
          python -m feux stocks
      - name: Application (docs/index.html)
        run: python -m feux dashboard
      - name: Alertes (changement de couleur ou de drapeau)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m feux alert
      - name: Backtest et robustesse (le vendredi, ou lancement manuel)
        run: |
          if [ "$(date -u +%u)" = "5" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python -m feux backtest; fi
      - name: Commit des données et du tableau de bord
        run: |
          git config user.name "feux-bot"
          git config user.email "feux-bot@users.noreply.github.com"
          git add data/universe.csv data/raw/isin_symbols.json docs
          git diff --cached --quiet || git commit -m "Mise à jour quotidienne $(date -u +%F)"
          git push
      # Le push du bot (GITHUB_TOKEN) ne déclenche pas d'autre workflow : on publie le site ici même.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
