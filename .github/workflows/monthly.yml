name: Brief mensuel

on:
  schedule:
    - cron: "0 7 1 * *"    # le 1er du mois à 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m feux update --strict
      - run: python -m feux signals
      - name: Brief mensuel (Telegram)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m feux brief
      - run: |
          git config user.name "feux-bot"
          git config user.email "feux-bot@users.noreply.github.com"
          git add data/series data/signals docs
          git diff --cached --quiet || git commit -m "Brief mensuel $(date -u +%F)"
          git push
